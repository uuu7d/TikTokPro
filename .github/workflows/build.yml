name: Build Theos Tweak

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      # 🧩 ذاكرة مؤقتة لتسريع عمليات البناء القادمة
      - name: ⚙️ Cache Theos
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ runner.os }}

      # 🧰 تثبيت الأدوات المطلوبة
      - name: 🛠️ Install dependencies
        run: |
          brew install dpkg ldid make git perl

      # 🧱 إعداد Theos فقط إذا لم يكن موجودًا مسبقًا
      - name: 📦 Setup Theos
        run: |
          echo "export THEOS=$THEOS" >> $HOME/.bash_profile
          mkdir -p $THEOS

          # التحقق من وجود Theos
          if [ ! -d "$THEOS/.git" ]; then
            echo "🔽 Cloning Theos framework..."
            git clone --recursive https://github.com/theos/theos.git $THEOS
          else
            echo "✅ Theos already exists, skipping clone."
          fi

          # التحقق من وجود SDKs
          if [ ! -d "$THEOS/sdks" ]; then
            echo "🔽 Cloning iOS SDKs..."
            git clone --recursive https://github.com/theos/sdks.git $THEOS/sdks
          else
            echo "✅ SDKs already exist, skipping clone."
          fi

          echo "✅ Theos and SDKs are ready."

      # 🏗️ بناء الأداة (tweak)
      - name: 🧩 Build Tweak
        run: |
          echo "🏗️ Building tweak using Theos..."
          make package FINALPACKAGE=1
          echo "✅ Build completed successfully."

      # 📦 حفظ ملف deb الناتج بعد البناء
      - name: 📤 Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: TikTokPro.deb
          path: packages/*.deb
