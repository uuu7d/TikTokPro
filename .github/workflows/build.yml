name: Build VCAMs Fat Dylib

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    env:
      SDKVERSION: latest
      LD_SHARED_CACHE_ELIGIBLE: "NO"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Homebrew dependencies
        run: |
          brew update || true
          brew install ldid dpkg git

      - name: Download Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS"

      - name: Build arm64 and arm64e dylib
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="$THEOS/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO
          
          # Build arm64
          echo "🏗️ Building VCAM for arm64..."
          make clean || true
          make ARCHS=arm64
          
          # Build arm64e
          echo "🏗️ Building VCAM for arm64e..."
          make clean || true
          make ARCHS=arm64e

          # Merge fat dylib
          echo "📦 Creating fat dylib..."
          lipo -create \
            "$THEOS/obj/arm64/VCAM.dylib" \
            "$THEOS/obj/arm64e/VCAM.dylib" \
            -output "$THEOS/obj/VCAM-fat.dylib"
          echo "✅ Fat dylib created at $THEOS/obj/VCAM-fat.dylib"

      - name: Upload VCAM fat dylib
        uses: actions/upload-artifact@v4
        with:
          name: VCAM-fat-dylib
          path: $GITHUB_WORKSPACE/theos/obj/VCAM-fat.dylib
