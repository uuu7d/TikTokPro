name: Build VCAM (Theos)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      LD_SHARED_CACHE_ELIGIBLE: "NO"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules initialized
        run: git submodule update --init --recursive

      - name: Install Homebrew tools
        run: |
          brew update || true
          brew install ldid || true
          brew install dpkg || true

      - name: Export THEOS and helpers
        run: |
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO
          echo "LD_SHARED_CACHE_ELIGIBLE=$LD_SHARED_CACHE_ELIGIBLE"

      - name: Build VCAM dylib using Theos
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO
          echo "🏗️ Building VCAM dylib using Theos..."
          make clean || true
          make
          echo "✅ Build completed successfully."

      - name: Upload VCAM dylib as artifact
        uses: actions/upload-artifact@v3
        with:
          name: VCAM-dylib
          path: ${{ github.workspace }}/obj/arm64/VCAM.dylib
