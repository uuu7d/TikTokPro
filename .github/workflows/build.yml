name: Build Theos Tweak (dylib)

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKVERSION: 16.5
      LD_SHARED_CACHE_ELIGIBLE: "NO"

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Cache Theos
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ runner.os }}

      - name: 🛠️ Install dependencies
        run: |
          brew update || true
          brew install dpkg ldid make git perl

      - name: 📦 Setup Theos and SDK 16.5
        run: |
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi

          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            mkdir -p $THEOS/sdks
            curl -L -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz \
              https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
            tar -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
          fi

      - name: 🧩 Build dylib (no deb)
        run: |
          set -e
          export THEOS="$THEOS"
          export PATH="$THEOS/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO

          echo "🏗️ Building dylib using Theos..."
          make clean || true
          make
          echo "✅ dylib build finished"

      - name: 📤 Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VCAM-dylib
          path: |
            .theos/obj/**/VCAM.dylib
