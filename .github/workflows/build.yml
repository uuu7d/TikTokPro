name: Build VCAM (Theos)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKVERSION: 16.5
      LD_SHARED_CACHE_ELIGIBLE: "NO"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules initialized (safe)
        run: git submodule update --init --recursive

      - name: Print environment
        run: |
          echo "THEOS = $THEOS"
          echo "SDKVERSION = $SDKVERSION"

      - name: Export THEOS and helpers
        run: |
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO

      - name: Build tweak using Theos
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO
          echo "🏗️ Building VCAM dylib using Theos..."
          make clean || true
          make

      - name: Create fat dylib
        working-directory: ${{ github.workspace }}
        run: |
          echo "🏗️ Creating fat dylib for VCAM..."
          lipo -create \
            .theos/obj/arm64/VCAM.dylib \
            .theos/obj/arm64e/VCAM.dylib \
            -output .theos/obj/VCAM-fat.dylib
          echo "✅ Fat dylib created at .theos/obj/VCAM-fat.dylib"

      - name: Upload fat dylib as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCAM-dylib
          path: ${{ github.workspace }}/.theos/obj/VCAM-fat.dylib
          if-no-files-found: warn
