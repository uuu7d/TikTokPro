name: Build VCAM Fat dylib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKVERSION: 16.5
      LD_SHARED_CACHE_ELIGIBLE: "NO"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules initialized
        run: git submodule update --init --recursive

      - name: Print environment
        run: |
          echo "THEOS = $THEOS"
          echo "SDKVERSION = $SDKVERSION"

      - name: Install Homebrew tools
        run: |
          brew update || true
          brew install ldid || true
          brew install dpkg || true

      - name: Export THEOS and helpers
        run: |
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO

      - name: Build VCAM dylibs
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO
          echo "🏗️ Building VCAM for arm64..."
          make clean || true
          make ARCHS=arm64
          echo "🏗️ Building VCAM for arm64e..."
          make clean || true
          make ARCHS=arm64e
          echo "📦 Creating fat dylib..."
          lipo -create \
            $THEOS/obj/arm64/VCAM.dylib \
            $THEOS/obj/arm64e/VCAM.dylib \
            -output $THEOS/obj/VCAM-fat.dylib
          echo "✅ Fat dylib created at $THEOS/obj/VCAM-fat.dylib"

      - name: Upload fat dylib as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCAM-fat-dylib
          path: ${{ github.workspace }}/.theos/obj/VCAM-fat.dylib
          if-no-files-found: error
