name: Build Theos Tweak

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Cache Theos
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ runner.os }}

      - name: 🛠️ Install dependencies
        run: |
          brew install dpkg ldid make git perl

      - name: 📦 Setup Theos and SDK 16.5
        run: |
          mkdir -p $THEOS
          echo "export THEOS=$THEOS" >> $HOME/.bash_profile

          if [ ! -d "$THEOS/.git" ]; then
            echo "🔽 Cloning Theos..."
            git clone --recursive https://github.com/theos/theos.git $THEOS
          else
            echo "✅ Theos exists, skipping."
          fi

          # تحميل SDK 16.5 إذا لم يكن موجودًا
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "🔽 Downloading iOS 16.5 SDK..."
            mkdir -p $THEOS/sdks
            curl -L -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
            tar -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
          else
            echo "✅ iOS 16.5 SDK already exists."
          fi

          echo "✅ Theos and SDK ready."

      - name: 🧩 Build Tweak
        run: |
          echo "🏗️ Building tweak using Theos..."
          make clean && make package FINALPACKAGE=1
          echo "✅ Build completed successfully."

      - name: 📤 Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: FuckMeIamHorny.dylib
          path: packages/*.dylib
