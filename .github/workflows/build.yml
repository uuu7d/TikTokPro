name: Build VCAM (Theos)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      LD_SHARED_CACHE_ELIGIBLE: "NO"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules initialized (safe)
        run: git submodule update --init --recursive

      - name: Print environment
        run: |
          echo "THEOS = $THEOS"
          echo "SDKVERSION = $SDKVERSION"

      - name: Install Homebrew tools (optional)
        run: |
          brew update || true
          brew install ldid || true
          brew install dpkg || true

      - name: Export THEOS and helpers
        run: |
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          echo "::add-mask::${THEOS}"
          export LD_SHARED_CACHE_ELIGIBLE=NO
          echo "LD_SHARED_CACHE_ELIGIBLE=$LD_SHARED_CACHE_ELIGIBLE"

      - name: Build tweak using Theos (optional deb)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO
          echo "🏗️ Building tweak package using Theos..."
          make clean || true

      - name: Build dylib using Theos
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          export THEOS="${THEOS}"
          export PATH="${THEOS}/bin:$PATH"
          export LD_SHARED_CACHE_ELIGIBLE=NO
          echo "🏗️ Building VCAM dylib using Theos..."
          make clean || true
          make
          echo "✅ Build completed successfully."
