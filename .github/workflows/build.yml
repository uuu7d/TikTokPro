name: Build Theos Tweak

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      # 🧩 ذاكرة مؤقتة لتسريع عمليات البناء القادمة
      - name: ⚙️ Cache Theos
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ runner.os }}

      # 🧰 تثبيت الأدوات المطلوبة
      - name: 🛠️ Install dependencies
        run: |
          brew install dpkg ldid make git perl

          # تنظيف مجلد sdks إن وُجد من قبل
          if [ -d "$THEOS/sdks" ]; then
            echo "🧹 Removing existing SDKs directory..."
            rm -rf "$THEOS/sdks"
          fi

          echo "🔽 Cloning iOS SDKs..."
          git clone --recursive https://github.com/theos/sdks.git $THEOS/sdks

          echo "✅ Theos and SDKs ready."

      # 🏗️ بناء الأداة (tweak)
      - name: 🧩 Build Tweak
        run: |
          echo "🏗️ Building tweak using Theos..."
          make package FINALPACKAGE=1
          echo "✅ Build completed successfully."

      # 📦 حفظ ملف deb الناتج بعد البناء
      - name: 📤 Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: TikTokPro.deb
          path: packages/*.deb
