name: Build Theos Tweak

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg ldid
          sudo xcode-select --switch /Applications/Xcode.app

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS path: $THEOS"

      - name: Set up environment
        run: |
          echo "export THEOS=$THEOS" >> $HOME/.bash_profile
          export THEOS=$THEOS
          mkdir -p $THEOS/vendor
          git clone --recursive https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build tweak (package)
        run: |
          make clean
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandboxTool_Package
          path: packages/*.deb
