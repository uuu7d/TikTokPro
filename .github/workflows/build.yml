name: Build Theos Tweak

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Install dependencies (Theos, make, etc.)
      - name: Install dependencies
        run: |
          # تثبيت Theos إذا لم يكن موجودًا
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          brew install make || true
          brew install clang || true

      # 3️⃣ تحميل iOS16 SDK
      - name: Download iOS 16 SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -L -o $THEOS/sdks/iPhoneOS16.0.sdk.tar.xz https://github.com/theos/sdks/releases/download/16.0/iPhoneOS16.0.sdk.tar.xz
          tar -xJf $THEOS/sdks/iPhoneOS16.0.sdk.tar.xz -C $THEOS/sdks

      # 4️⃣ Build tweak
      - name: Build tweak using Theos
        run: |
          echo "🏗️ Building tweak..."
          export THEOS_PLATFORM_SDK=$THEOS/sdks/iPhoneOS16.0.sdk
          make package FINALPACKAGE=1
          echo "✅ Build completed successfully."

      # 5️⃣ Archive the .deb package
      - name: Archive output
        run: |
          mkdir -p output
          cp .theos/obj/*.deb output/ || true
        shell: bash

      # 6️⃣ Upload the .deb artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: tweak-package
          path: output/
