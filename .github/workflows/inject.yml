name: Inject Tweak into IPA

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install dependencies
        run: |
          brew update
          brew install ldid unzip zip

      - name: 📁 Prepare workspace
        run: |
          mkdir -p artifacts tools work
          echo "✅ Workspace ready."

      - name: 📦 Download prebuilt insert_dylib
        run: |
          echo "📦 Downloading prebuilt insert_dylib..."
          curl -L -o tools/insert_dylib https://github.com/zhuowei/insert_dylib/releases/download/1.0/insert_dylib_macos_arm64
          chmod +x tools/insert_dylib
          echo "✅ insert_dylib ready."

      - name: 📦 Extract IPA
        run: |
          echo "📂 Extracting IPA..."
          cd artifacts
          unzip -o App.ipa -d ../work/
          cd ../work
          APP_PATH=$(find Payload -type d -name "*.app" | head -n 1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "✅ Found app at $APP_PATH"

      - name: 💉 Inject tweak dylib
        run: |
          echo "💉 Injecting tweak..."
          cd work
          APP_BINARY=$(basename "$APP_PATH" .app)
          echo "App binary: $APP_BINARY"
          ../tools/insert_dylib --all-yes ../artifacts/Tweak.dylib "$APP_PATH/$APP_BINARY" "$APP_PATH/${APP_BINARY}_patched"
          mv "$APP_PATH/${APP_BINARY}_patched" "$APP_PATH/$APP_BINARY"
          echo "✅ Injection done."

      - name: 🔏 Re-sign app binary
        run: |
          echo "🔏 Re-signing app..."
          cd work
          APP_BINARY=$(basename "$APP_PATH" .app)

          # إزالة التوقيعات القديمة
          find "$APP_PATH" -name "_CodeSignature" -exec rm -rf {} +
          find "$APP_PATH" -name "CodeResources" -exec rm -rf {} +

          # توقيع التطبيق والمكتبة المحقونة
          ldid -S "$APP_PATH/$APP_BINARY"
          ldid -S ../artifacts/Tweak.dylib || true

          echo "✅ Re-sign completed."

      - name: 📦 Repack IPA
        run: |
          echo "📦 Repacking IPA..."
          cd work
          zip -r ../artifacts/App_patched_signed.ipa Payload
          echo "✅ Done! Saved as artifacts/App_patched_signed.ipa"

      - name: 🚀 Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: App_patched_signed
          path: artifacts/App_patched_signed.ipa
 