name: 💉 Build and Inject Multiple Dylibs

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Cache Theos
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ runner.os }}

      - name: 🧱 Install dependencies
        run: |
          brew install dpkg ldid make git perl python3

      - name: 🧩 Setup Theos and iOS SDK 16.5
        run: |
          mkdir -p $THEOS
          echo "export THEOS=$THEOS" >> $HOME/.bash_profile

          if [ ! -d "$THEOS/.git" ]; then
            echo "📦 Cloning Theos..."
            git clone --recursive https://github.com/theos/theos.git $THEOS
          else
            echo "✅ Theos already exists."
          fi

          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "📦 Downloading iOS 16.5 SDK..."
            mkdir -p $THEOS/sdks
            curl -L -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
            tar -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
          else
            echo "✅ iOS 16.5 SDK already exists."
          fi

      - name: 🏗️ Build tweak
        run: |
          echo "🏗️ Building tweak using Theos..."
          make package FINALPACKAGE=1
          mkdir -p artifacts
          cp packages/*.dylib artifacts/ || true
          echo "✅ Build completed successfully."

      - name: 📦 Download working yololib
        run: |
          echo "📦 Downloading yololib..."
          mkdir -p tools
          curl -L -o tools/yololib.py https://raw.githubusercontent.com/uraimo/yololib/master/yololib.py
          chmod +x tools/yololib.py
          echo "✅ yololib ready."

      - name: 💉 Inject all dylibs into .ipa
        run: |
          echo "💉 Injecting tweak(s)..."
          cd work

          APP_PATH="Payload/Shuggr.app"
          APP_BINARY=$(basename "$APP_PATH" .app)

          echo "App binary: $APP_BINARY"

          for dylib in ../artifacts/*.dylib; do
            name=$(basename "$dylib")
            echo "➡️ Injecting $name..."
            python3 ../tools/yololib.py "$APP_PATH/$APP_BINARY" "@executable_path/$name"
            cp "$dylib" "$APP_PATH/"
          done

          echo "✅ All dylibs injected."

      - name: 📤 Upload dylib(s)
        uses: actions/upload-artifact@v4
        with:
          name: Injected_Dylibs
          path: artifacts/*.dylib
