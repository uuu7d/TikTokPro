name: 🧩 Build & Inject Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      APP_PATH: Payload/Shuggr.app

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Install dependencies
        run: |
          brew install make ldid dpkg git python3 unzip zip

      - name: 🧱 Setup Theos and iOS SDK 16.5
        run: |
          mkdir -p $THEOS
          if [ ! -d "$THEOS/.git" ]; then
            echo "📥 Cloning Theos..."
            git clone --recursive https://github.com/theos/theos.git $THEOS
          else
            echo "✅ Theos already exists."
          fi

          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "📥 Downloading iOS 16.5 SDK..."
            mkdir -p $THEOS/sdks
            curl -L -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
            tar -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
          else
            echo "✅ SDK already available."
          fi

      - name: 🧩 Build tweak (output dylib)
        run: |
          echo "🏗️ Building tweak using Theos..."
          make clean
          make FINALPACKAGE=1
          mkdir -p artifacts
          find . -name "*.dylib" -exec cp {} artifacts/ \;
          echo "✅ Build completed successfully."

      - name: 📦 Extract IPA
        run: |
          mkdir -p work
          cd work
          unzip ../artifacts/App.ipa
          echo "✅ IPA extracted."

      - name: 🐍 Download yololib (dylib injector)
        run: |
          mkdir -p tools
          curl -L -o tools/yololib.py https://raw.githubusercontent.com/rileytestut/yololib/master/yololib.py
          chmod +x tools/yololib.py

      - name: 💉 Inject tweak(s)
        run: |
          echo "💉 Injecting tweak(s)..."
          cd work

          APP_PATH="Payload/Shuggr.app"
          APP_BINARY=$(basename "$APP_PATH" .app)
          echo "App binary: $APP_BINARY"

          for dylib in ../artifacts/*.dylib; do
            name=$(basename "$dylib")
            echo "➡️ Injecting $name..."
            python3 ../tools/yololib.py "$APP_PATH/$APP_BINARY" "@executable_path/$name"
            cp "$dylib" "$APP_PATH/"
          done

          echo "✅ All dylibs injected."

      - name: 📦 Repack Patched IPA
        run: |
          cd work
          zip -r ../artifacts/App_Patched.ipa Payload
          echo "✅ App_Patched.ipa created."

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App_Patched
          path: artifacts/Shuggr_Patched.ipa
