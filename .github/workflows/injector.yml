name: Build & Inject using ios-dylib-inject

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-inject:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Install base dependencies
        run: |
          brew update
          brew install dpkg ldid make git perl python3 zip unzip curl || true
          echo "✅ base deps installed"

      - name: 📦 Setup Theos and iOS SDK 16.5 (optional)
        run: |
          mkdir -p $THEOS
          echo "export THEOS=$THEOS" >> $HOME/.bash_profile
          if [ ! -d "$THEOS/.git" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            mkdir -p $THEOS/sdks
            curl -L -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz \
              https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
            tar -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
          fi
          echo "✅ Theos+SDK ready (if needed)"

      - name: 🧩 Build tweak(s) (Theos) → produce .dylib (optional)
        run: |
          # If you don't build with Theos, skip this step and ensure your .dylib files are in artifacts/
          if [ -f Makefile ]; then
            echo "🏗 Building Theos project (if present)"
            make clean || true
            make FINALPACKAGE=1 || true
            mkdir -p artifacts
            find .theos/obj -name "*.dylib" -exec cp {} artifacts/ \; || true
            echo "✅ Copied built dylibs to artifacts/"
          else
            echo "ℹ️ No Makefile found — skipping Theos build (ensure .dylib in artifacts/)"
          fi

      - name: 🧰 Prepare workspace & check artifacts
        run: |
          mkdir -p work tools output
          ls -la artifacts || echo "⚠️ artifacts/ not present or empty — ensure App.ipa and/or .dylib are placed there."
          echo "✅ workspace prepared"

      - name: 🔽 Clone ios-dylib-inject (flexible)
        run: |
          # Clone a maintained fork of ios-dylib-inject. If you prefer a different repo, replace this URL.
          rm -rf tools/ios-dylib-inject
          git clone https://github.com/gnithin/ios-dylib-inject.git tools/ios-dylib-inject || true
          echo "Contents of tools/ios-dylib-inject:"
          ls -la tools/ios-dylib-inject || true

      - name: 📦 Extract IPA into work/
        run: |
          mkdir -p work
          cd work
          # Copy App.ipa from artifacts (you can upload it in the repo or to artifacts/ before run)
          cp ../artifacts/App.ipa . || true
          if [ -f App.ipa ]; then
            unzip -o App.ipa >/dev/null 2>&1 || (echo "⚠️ failed unzip; App.ipa may be invalid" && exit 1)
            echo "✅ App.ipa extracted"
          else
            echo "❗ No App.ipa in artifacts/. Place file artifacts/App.ipa and re-run workflow."
            exit 1
          fi

      - name: 🧭 Detect .app and binary
        run: |
          cd work
          APP_PATH=$(find Payload -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in Payload/ — aborting."
            exit 1
          fi
          APP_BINARY=$(basename "$APP_PATH" .app)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "APP_BINARY=$APP_BINARY" >> $GITHUB_ENV
          echo "Detected app: $APP_PATH (binary: $APP_BINARY)"

      - name: 🔧 Locate ios-dylib-inject script & make executable
        run: |
          # Search for an injection script inside the cloned repo
          TOOLDIR=tools/ios-dylib-inject
          SCRIPT=""
          # common script filenames
          for f in "$TOOLDIR"/inject.py "$TOOLDIR"/ios-dylib-inject.py "$TOOLDIR"/inject_dylib.py "$TOOLDIR"/inject; do
            if [ -f "$f" ]; then
              SCRIPT="$f"
              break
            fi
          done
          # fallback: pick the first .py or executable in the repo
          if [ -z "$SCRIPT" ]; then
            SCRIPT=$(find "$TOOLDIR" -maxdepth 2 -type f -name "*inject*.py" | head -n1 || true)
          fi
          if [ -z "$SCRIPT" ]; then
            # try any executable file
            SCRIPT=$(find "$TOOLDIR" -maxdepth 2 -type f -perm +111 | head -n1 || true)
          fi

          if [ -z "$SCRIPT" ]; then
            echo "❌ Could not find injection script inside $TOOLDIR. Listing contents for debugging:"
            ls -la "$TOOLDIR"
            exit 1
          fi

          echo "✅ Using injection script: $SCRIPT"
          chmod +x "$SCRIPT"
          echo "SCRIPT_PATH=$SCRIPT" >> $GITHUB_ENV

      - name: 💉 Inject all dylibs using ios-dylib-inject
        env:
          APP_PATH: ${{ env.APP_PATH }}
        run: |
          set -e
          cd work
          echo "Using script: $SCRIPT_PATH"
          # Ensure there are dylibs to inject
          (ls ../artifacts/*.dylib >/dev/null 2>&1) || (echo "❗ No .dylib files found in artifacts/ — aborting." && exit 1)

          for dylib in ../artifacts/*.dylib; do
            name=$(basename "$dylib")
            echo "➡️ Preparing to inject $name"

            # copy the dylib into the .app bundle
            cp "$dylib" "$APP_PATH/$name"

            # run injection script. We try a few common invocation patterns.
            # 1) python script expects (binary_path, dylib_path)
            if python3 "$SCRIPT_PATH" "$APP_PATH/$APP_BINARY" "@executable_path/$name" >/dev/null 2>&1; then
              echo "✅ injected $name (python invocation)"
              continue
            fi

            # 2) python script expects different args: dylib then binary
            if python3 "$SCRIPT_PATH" "$APP_PATH/$name" "$APP_PATH/$APP_BINARY" >/dev/null 2>&1; then
              echo "✅ injected $name (python alternate)"
              continue
            fi

            # 3) If script is executable binary supporting similar CLI
            if "$SCRIPT_PATH" "$APP_PATH/$APP_BINARY" "@executable_path/$name" >/dev/null 2>&1; then
              echo "✅ injected $name (exec invocation)"
              continue
            fi

            # 4) Fallback: try 'install_name_tool' approach (best-effort)
            echo "⚠️ Fallback: using install_name_tool to add load command"
            if command -v install_name_tool >/dev/null 2>&1; then
              install_name_tool -add_rpath "@executable_path" "$APP_PATH/$APP_BINARY" || true
              install_name_tool -change "$name" "@executable_path/$name" "$APP_PATH/$APP_BINARY" || true
              echo "ℹ️ attempted fallback injection for $name"
            else
              echo "❌ No supported injection method succeeded for $name — aborting."
              exit 1
            fi
          done

          echo "✅ All dylib injection attempts finished."

      - name: 🔁 Resign app binary + embedded dylibs (ldid)
        run: |
          cd work
          echo "Removing existing code signature..."
          APP_PATH=$(find Payload -type d -name "*.app" | head -n 1)
          APP_BINARY=$(basename "$APP_PATH" .app)

          # remove code signature folder if present
          find "$APP_PATH" -name "_CodeSignature" -exec rm -rf {} \; || true
          find "$APP_PATH" -name "CodeResources" -exec rm -f {} \; || true

          echo "Signing embedded dylibs and app binary with ldid..."
          for lib in "$APP_PATH"/*.dylib; do
            if [ -f "$lib" ]; then
              ldid -S "$lib" || true
            fi
          done

          ldid -S "$APP_PATH/$APP_BINARY" || true
          echo "✅ Resigning done."

      - name: 📦 Repack patched IPA
        run: |
          cd work
          zip -r ../output/InjectedApp.ipa Payload >/dev/null 2>&1
          ls -lh ../output/InjectedApp.ipa
          echo "✅ Repacked to output/InjectedApp.ipa"

      - name: 📤 Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: InjectedApp.ipa
          path: output/InjectedApp.ipa
